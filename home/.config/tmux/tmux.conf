# Zellij-style keymap for tmux — Alt-centric, modeless.

# --- base behaviour ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10

# --- pane focus (Alt+arrows) ---
bind -n M-Left  if -F '#{pane_at_left}'  'previous-window' 'select-pane -L'
bind -n M-Right if -F '#{pane_at_right}' 'next-window'     'select-pane -R'
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- pane splits ---
bind -n M-d split-window -v -c "#{pane_current_path}"
bind -n M-r split-window -h -c "#{pane_current_path}"

# --- close pane ---
bind -n M-w kill-pane

# --- tabs (windows) ---
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-, command-prompt -I "#W" "rename-window '%%'"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-i swap-window -t -1 \; select-window -t -1
bind -n M-o swap-window -t +1 \; select-window -t +1

# --- session ---
bind -n M-q detach-client

# --- clipboard (WSL via clip.exe) ---
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"
bind -n DoubleClick1Pane copy-mode -M \; send -X select-word \; send -X copy-pipe-and-cancel "clip.exe"
bind -n TripleClick1Pane copy-mode -M \; send -X select-line \; send -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode    Enter send -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "clip.exe"

# ============================================================================
# Status bar: catppuccin, tabs only.
# ============================================================================

# Truecolor.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left ""
set -g status-right ""

# --- plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# --- catppuccin look ---
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

set -g monitor-bell on
set -g bell-action none
set -g visual-bell off

# --- TPM bootstrap ---
run '~/.config/tmux/plugins/tpm/tpm'
